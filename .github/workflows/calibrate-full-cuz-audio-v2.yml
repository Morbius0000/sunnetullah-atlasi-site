name: Calibrate full-cuz audio alignment v2

on:
  push:
    branches:
      - fix/full-cuz-audio-v2
    paths:
      - scripts/align_full_cuz_audio_v2.py
      - .github/workflows/calibrate-full-cuz-audio-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cuz: [1, 2]
    env:
      CUZ: ${{ matrix.cuz }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache speech recognition model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small-int8-v1

      - name: Install alignment dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q \
            faster-whisper==1.2.0 rapidfuzz==3.14.1

      - name: Run official full-cüz alignment pilot
        run: |
          set -euo pipefail
          python scripts/align_full_cuz_audio_v2.py

      - name: Content-based pilot gate
        run: |
          python - <<'PY'
          import json, os
          cuz=int(os.environ["CUZ"])
          q=json.load(open(f"out/full-cuz-v2-{cuz:02d}.json",encoding="utf-8"))
          assert q["quran_key_count"] > 100
          assert q["quran_key_count"] == q["expanded_meal_key_count"]
          assert q["invalid_time_count"] == 0
          assert q["reverse_time_count"] == 0
          assert q["unresolved_unit_count"] == 0
          assert q["global_exact_token_coverage"] >= 0.85
          assert q["global_edit_similarity"] >= 0.80
          assert q["low_or_unresolved_unit_count"] <= 5
          if cuz==1:
              assert q["quran_key_count"]==148
              assert q["calibration"]["available"] is True
              assert q["calibration"]["count"]==141
          print("FULL_CUZ_CONTENT_GATE_PASS", json.dumps({
              "cuz":cuz,
              "quran_keys":q["quran_key_count"],
              "meal_units":q["meal_unit_count"],
              "global_exact":q["global_exact_token_coverage"],
              "global_similarity":q["global_edit_similarity"],
              "low_units":q["low_or_unresolved_unit_count"],
              "diagnostics":q["low_unit_diagnostics"],
          },ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-cuz-v2-pilot-cuz-${{ matrix.cuz }}
          path: out/full-cuz-v2-*.json
          retention-days: 7
