name: Generate verified cüz 1 enrichment

on:
  push:
    branches:
      - chatgpt/cuz01-full-v1
    paths:
      - .github/workflows/generate-cuz01.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cuz01-full-v1
          fetch-depth: 0

      - name: Generate Diyanet + Yaşar Nuri + bounded Mazlum Kiper layer
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, html, re, json, pathlib, subprocess, hashlib

          BOUNDARIES=[44.58,48.74,57.26,66.68,75.28,84.06,91.48,102.28,110.22,119.72,134.46,142.5,149.34,163.32,180.66,192.12,205.38,222.12,228.26,250.94,272.66,281.24,296.08,312.64,325.02,357.24,385.64,407.6,422.24,434.72,457.74,471.16,486.82,508.7,524.58,535.36,553.86,570.4,585.48,595.58,609.16,624.1,629.34,634.14,647.72,659.1,666.44,674.82,688.74,704.26,713.04,723.76,728.92,735.76,762.32,774.58,780.96,801.86,822.12,835.56,857.26,902.08,927.24,944.44,954.94,965.22,974.76,991.06,1007.26,1020.34,1034,1055.46,1065.84,1080.98,1105.44,1118.9,1144.06,1151.18,1164.24,1182.2,1203.06,1216.64,1224.36,1249.44,1267.84,1312.66,1323,1348.5,1360,1388.72,1409.3,1436.2,1446.08,1476.68,1491.36,1502.38,1525.22,1540.48,1551.68,1557.74,1568.06,1586.68,1660.24,1676.28,1685.32,1701.5,1718.26,1728.86,1742.74,1766.92,1780.52,1795.22,1809.48,1836.72,1858.54,1870.66,1881.14,1888.7,1910.7,1921.12,1943.1,1957,1965.78,1982.98,2007.62,2028.66,2055.12,2070.18,2088.1,2105.76,2118.36,2124.2,2137.22,2162.36,2176.36,2191.22,2216.12,2237.22,2246.52,2265.26,2290.58,2304.62]
          assert len(BOUNDARIES)==142, len(BOUNDARIES)
          AUDIO="https://audios.tmgrup.com.tr/i.tmgrup.com.tr/fikriyat/2019/12/27/b6e798d7-ed88-485b-a774-9c8a3733cc97/1577452395285.mp3"
          MEAL_ID="diyanet-isleri-baskanligi-meali-1"

          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              return urllib.request.urlopen(req,timeout=45).read().decode("utf-8","replace")

          # 1) Current official Diyanet page text: one request per Mushaf page, not per verse.
          starts=[1,6,17,25,30,38,49,58,62,70,77,84,89,94,102,106,113,120,127,135]
          diyanet={}
          pat=re.compile(r'<h3[^>]*class=["\']spH3["\'][^>]*>\s*(\d+)\s*\.\s*Meal\s*</h3>.*?<span[^>]*class=["\']mealViewFullText["\'][^>]*>(.*?)</span>',re.I|re.S)
          for a in starts:
              url=f"https://kuran.diyanet.gov.tr/mushaf/kuran-meal-1/bakara-suresi-2/ayet-{a}/diyanet-isleri-baskanligi-meali-1"
              raw=fetch(url)
              for no,body in pat.findall(raw):
                  no=int(no)
                  txt=re.sub(r'<[^>]+>',' ',body)
                  txt=html.unescape(re.sub(r'\s+',' ',txt)).strip()
                  if 1<=no<=141:
                      if no in diyanet and diyanet[no]!=txt:
                          raise SystemExit(f"Diyanet duplicate mismatch 2:{no}")
                      diyanet[no]=txt
          miss=[n for n in range(1,142) if n not in diyanet]
          if miss:
              raise SystemExit("Missing official Diyanet verses: "+repr(miss))

          # 2) User-approved Yaşar Nuri source and canonical Arabic from the matrix source repo.
          yn_url="https://raw.githubusercontent.com/Morbius0000/sunnetullah-matrisi/main/data/turkce_anlam/kaynaklar/yasar_nuri_ozturk_meal.json"
          yn=json.loads(fetch(yn_url))
          yn_map={r["ayet_ref"]:r["meal_tr"] for r in yn["kayitlar"]}
          if len(yn_map)!=6236:
              raise SystemExit(f"Yaşar Nuri source not 6236: {len(yn_map)}")

          q_url="https://raw.githubusercontent.com/Morbius0000/sunnetullah-matrisi/main/data/kaynak_metin/quran-uthmani.txt"
          q=fetch(q_url)
          ar={}
          for line in q.splitlines():
              if not line.strip(): continue
              s,a,t=line.split("|",2)
              ar[f"{int(s)}:{int(a)}"]=t
          if len(ar)!=6236:
              raise SystemExit(f"Arabic source not 6236: {len(ar)}")

          # 3) Confirm the public Mazlum Kiper cüz source is reachable and has the same full-cüz duration.
          audio_path=pathlib.Path("/tmp/cuz01.mp3")
          req=urllib.request.Request(AUDIO,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as resp, audio_path.open("wb") as f:
              while True:
                  b=resp.read(1024*1024)
                  if not b: break
                  f.write(b)
          if audio_path.stat().st_size < 20_000_000:
              raise SystemExit("Mazlum Kiper cüz 1 source unexpectedly small")
          dur=float(subprocess.check_output([
              "ffprobe","-v","error","-show_entries","format=duration",
              "-of","default=noprint_wrappers=1:nokey=1",str(audio_path)
          ],text=True).strip())
          if abs(dur-2307.692)>2.0:
              raise SystemExit(f"Unexpected Mazlum Kiper duration: {dur}")

          # 4) Boundary integrity + seven independently known anchors from the same recording.
          anchors={
              30:(434.470,457.370),
              32:(471.050,486.540),
              116:(1870.520,1881.110),
              126:(2028.580,2054.910),
              127:(2055.220,2069.900),
              128:(2070.070,2087.730),
              129:(2088.290,2105.430),
          }
          anchor_report={}
          for ay,(es,ee) in anchors.items():
              s,e=BOUNDARIES[ay-1],BOUNDARIES[ay]
              ds, de=abs(s-es),abs(e-ee)
              anchor_report[str(ay)]={"start_delta":round(ds,3),"end_delta":round(de,3)}
              if ds>0.55 or de>0.55:
                  raise SystemExit(f"Anchor drift 2:{ay}: {ds:.3f}/{de:.3f}")
          for i in range(141):
              s,e=BOUNDARIES[i],BOUNDARIES[i+1]
              if not (0<=s<e<=dur+0.5):
                  raise SystemExit(f"Bad boundary 2:{i+1}: {s}-{e}")

          # 5) Build an additive layer. It never edits canonical atlas_public.* research data.
          verses={}
          for ay in range(1,142):
              key=f"2:{ay}"
              verses[key]={
                  "sure_no":2,
                  "ayet_no":ay,
                  "arapca":ar[key],
                  "meal_tr":yn_map[key],
                  "meal_kaynagi":"Yaşar Nuri Öztürk",
                  "diyanet_tr":diyanet[ay],
                  "diyanet_kaynagi":"Diyanet İşleri Başkanlığı Meali",
                  "meal_source_id":MEAL_ID,
                  "audio_meal_source_id":MEAL_ID,
                  "audio_src":AUDIO,
                  "audio_start":round(BOUNDARIES[ay-1],3),
                  "audio_end":round(BOUNDARIES[ay],3),
                  "audio_verified":True,
                  "audio_voice":"Mazlum Kiper",
                  "audio_cuz":1,
                  "alignment_method":"silence-boundary-v1+7-independent-anchors"
              }

          payload={
              "version":"cuz01-v1",
              "scope":"Bakara 2:1-141",
              "status":"verified-cuz01",
              "audio_source":"Mazlum Kiper · 1. cüz · Fikriyat",
              "audio_source_url":AUDIO,
              "meal_source_id":MEAL_ID,
              "audio_meal_source_id":MEAL_ID,
              "verses":verses
          }
          js="// Generated cüz 1 enrichment. Canonical Atlas research data is NOT modified.\n"
          js+="(function () {\n"
          js+="  var root = window.ATLAS_VERSE_ENRICHMENT = window.ATLAS_VERSE_ENRICHMENT || { verses: {} };\n"
          js+="  root.verses = root.verses || {};\n"
          js+="  var layer = "+json.dumps(payload,ensure_ascii=False,separators=(',',':'))+";\n"
          js+="  Object.keys(layer.verses).forEach(function (k) { root.verses[k] = layer.verses[k]; });\n"
          js+="  root.cuz01 = { version: layer.version, scope: layer.scope, status: layer.status, audio_source: layer.audio_source, meal_source_id: layer.meal_source_id, audio_meal_source_id: layer.audio_meal_source_id };\n"
          js+="}());\n"

          pathlib.Path("data/verse_enrichment_cuz01.js").write_text(js,encoding="utf-8")
          qa={
              "version":"cuz01-v1",
              "bakara_verse_count":len(verses),
              "expected_bakara_verse_count":141,
              "first_juz_total_with_fatiha":148,
              "diyanet_count":len(diyanet),
              "yasar_nuri_source_count":len(yn_map),
              "arabic_source_count":len(ar),
              "audio_duration_sec":round(dur,3),
              "audio_bytes":audio_path.stat().st_size,
              "audio_sha256":hashlib.sha256(audio_path.read_bytes()).hexdigest(),
              "meal_audio_source_lock":all(v["meal_source_id"]==v["audio_meal_source_id"] for v in verses.values()),
              "anchors":anchor_report,
              "boundary_count":len(BOUNDARIES),
              "status":"PASS"
          }
          pathlib.Path("data/cuz01_audio_qa.json").write_text(json.dumps(qa,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(qa,ensure_ascii=False,indent=2))
          PY

      - name: Static generated-layer checks
        shell: bash
        run: |
          node --check data/verse_enrichment_cuz01.js
          python - <<'PY'
          import json,re
          q=json.load(open("data/cuz01_audio_qa.json",encoding="utf-8"))
          assert q["status"]=="PASS"
          assert q["bakara_verse_count"]==141
          assert q["first_juz_total_with_fatiha"]==148
          assert q["meal_audio_source_lock"] is True
          js=open("data/verse_enrichment_cuz01.js",encoding="utf-8").read()
          assert len(re.findall(r'"2:\\d+"',js))==141
          print("CUZ01_STATIC_QA_PASS")
          PY

      - name: Commit generated cüz 1 layer
        shell: bash
        run: |
          git config user.name "Atlas QA Bot"
          git config user.email "atlas-qa-bot@users.noreply.github.com"
          git add data/verse_enrichment_cuz01.js data/cuz01_audio_qa.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate cüz 1 Diyanet + Mazlum Kiper layer [generated-cuz01]"
          git push origin HEAD:chatgpt/cuz01-full-v1
