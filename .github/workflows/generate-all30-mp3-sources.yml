name: Generate verified Mazlum Kiper cüz MP3 source map

on:
  push:
    branches:
      - chatgpt/atlas-30cuz-source-locked-v1
    paths:
      - .github/workflows/generate-all30-mp3-sources.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover and verify all 30 official Fikriyat MP3 sources
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, urllib.request, pathlib, time

          UA={"User-Agent":"Mozilla/5.0 AtlasSourceVerifier/1.0"}
          out={}
          for n in range(1,31):
              page=f"https://www.fikriyat.com/dinle/mazlum-kiper/{n}-cuz/dinle"
              req=urllib.request.Request(page,headers=UA)
              raw=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
              # The page embeds a JSON playlist. Anchor the match to the requested cüz index.
              patterns=[
                  rf'"title":"{n}\. cüz - Mazlum Kiper Dinle".{{0,2500}}?"mp3":"(https://[^"]+\.mp3)"',
                  rf'"originalTitle":"{n}\. cüz".{{0,3500}}?"mp3":"(https://[^"]+\.mp3)"',
                  rf'"mp3":"(https://[^"]+\.mp3)".{{0,1200}}?"index":{n}(?:,|\}})'
              ]
              url=None
              for pat in patterns:
                  m=re.search(pat,raw,re.S)
                  if m:
                      url=m.group(1).replace("\\/","/")
                      break
              if not url:
                  # Fallback: locate all MP3/index pairs and pick the requested index.
                  pairs=re.findall(r'"mp3":"(https://[^"]+\.mp3)".{0,1200}?"index":(\d+)',raw,re.S)
                  for u,i in pairs:
                      if int(i)==n:
                          url=u.replace("\\/","/")
                          break
              if not url:
                  raise SystemExit(f"cüz {n}: MP3 URL not found on {page}")

              # Verify source is reachable and really returns audio bytes.
              vreq=urllib.request.Request(url,headers={**UA,"Range":"bytes=0-4095"})
              resp=urllib.request.urlopen(vreq,timeout=40)
              sample=resp.read(4096)
              ctype=(resp.headers.get("Content-Type") or "").lower()
              crange=resp.headers.get("Content-Range")
              clen=resp.headers.get("Content-Length")
              if len(sample)<512:
                  raise SystemExit(f"cüz {n}: audio sample too short")
              if not (sample.startswith(b"ID3") or sample[:2] in (b"\xff\xfb",b"\xff\xf3",b"\xff\xf2") or "audio" in ctype or "octet-stream" in ctype):
                  raise SystemExit(f"cüz {n}: response does not look like MP3: {ctype} {sample[:8]!r}")

              out[str(n)]={
                  "cuz":n,
                  "voice":"Mazlum Kiper",
                  "meal_source":"Diyanet İşleri Başkanlığı Meali",
                  "page_url":page,
                  "audio_src":url,
                  "content_type":ctype,
                  "content_range":crange,
                  "probe_content_length":clen,
                  "verified":True
              }
              print("CUZ",n,"OK",url)
              time.sleep(0.10)

          if len(out)!=30 or any(not out[str(i)]["verified"] for i in range(1,31)):
              raise SystemExit("30/30 source verification failed")
          path=pathlib.Path("data/mazlum_kiper_cuz_sources.json")
          path.write_text(json.dumps({
              "version":"all30-v1",
              "source_site":"Fikriyat",
              "voice":"Mazlum Kiper",
              "meal_source_id":"diyanet-isleri-baskanligi-meali-1",
              "count":30,
              "sources":out
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("ALL30_MP3_SOURCE_PASS")
          PY

      - name: Validate generated source map
        run: |
          python - <<'PY'
          import json
          x=json.load(open("data/mazlum_kiper_cuz_sources.json",encoding="utf-8"))
          assert x["count"]==30
          assert len(x["sources"])==30
          assert all(x["sources"][str(i)]["verified"] for i in range(1,31))
          assert all(x["sources"][str(i)]["audio_src"].startswith("https://audios.tmgrup.com.tr/") for i in range(1,31))
          print("ALL30_MP3_QA_PASS")
          PY

      - name: Commit verified source map
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mazlum_kiper_cuz_sources.json
          if git diff --cached --quiet; then
            echo "No source-map changes."
            exit 0
          fi
          git commit -m "Add verified official MP3 sources for all 30 cüz [generated-all30]"
          git push
