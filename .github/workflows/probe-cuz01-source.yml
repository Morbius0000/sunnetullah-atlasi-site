name: Probe Mazlum Kiper Cuz 1 source

on:
  push:
    branches:
      - chatgpt/cuz01-full-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Fikriyat page for the exact 1st juz audio source
        shell: bash
        run: |
          python - <<'PY'
          import html, re, urllib.request
          url = "https://www.fikriyat.com/dinle/kuran-i-kerim-dinle/meal-cuz-dinle/mazlum-kiper-cuz/calma-listesi"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          raw = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          print("HTML_BYTES", len(raw.encode("utf-8")))
          decoded = html.unescape(raw).replace("\\/", "/")
          patterns = [
              r'https?://[^"\'<> ]+\.(?:mp3|m4a|aac)(?:\?[^"\'<> ]*)?',
              r'https?://[^"\'<> ]*(?:audio|podcast|media|cdn)[^"\'<> ]+',
          ]
          found=[]
          for pat in patterns:
              for m in re.findall(pat, decoded, flags=re.I):
                  if m not in found:
                      found.append(m)
          print("CANDIDATE_COUNT", len(found))
          for x in found[:100]:
              print("CANDIDATE", x[:1000])
          for needle in [".mp3",".m4a","audio","38:27","Mazlum Kiper","Bakara Suresi"]:
              print("----", needle)
              pos=0; shown=0
              while shown<12:
                  i=decoded.lower().find(needle.lower(),pos)
                  if i<0: break
                  print(decoded[max(0,i-350):i+700].replace("\n"," ")[:1200])
                  pos=i+len(needle); shown+=1
          PY
