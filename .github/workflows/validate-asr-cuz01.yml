name: Validate monotonic ASR alignment on verified cüz 1

on:
  push:
    branches: [chatgpt/atlas-30cuz-source-locked-v1]
    paths: [.github/workflows/validate-asr-cuz01.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install audio + ASR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q faster-whisper==1.2.0 rapidfuzz

      - name: Transcribe official Mazlum Kiper cüz 1 and align monotonically against exact Diyanet text
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,urllib.request,pathlib,unicodedata,statistics,math,subprocess
          from rapidfuzz.distance import Levenshtein
          from faster_whisper import WhisperModel

          node=r"""
          global.window={};
          require('./data/verse_enrichment_cuz01.js');
          process.stdout.write(JSON.stringify(window.ATLAS_VERSE_ENRICHMENT.verses));
          """
          verses=json.loads(subprocess.check_output(["node","-e",node],text=True))
          keys=[f"2:{i}" for i in range(1,142)]
          audio=verses["2:1"]["audio_src"]

          mp3=pathlib.Path("/tmp/cuz01.mp3")
          req=urllib.request.Request(audio,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as r, mp3.open("wb") as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          print("AUDIO_BYTES",mp3.stat().st_size)

          def norm_word(s):
              s=unicodedata.normalize("NFKD",str(s)).casefold()
              s="".join(ch for ch in s if not unicodedata.combining(ch))
              s=s.replace("ı","i").replace("ş","s").replace("ç","c").replace("ğ","g").replace("ö","o").replace("ü","u")
              return re.sub(r"[^a-z0-9]+","",s)

          exp_tokens=[]
          verse_spans={}
          for k in keys:
              start=len(exp_tokens)
              for tok in re.findall(r"[\wÇĞİÖŞÜçğıöşüÂâÎîÛû’']+",verses[k]["diyanet_tr"],flags=re.UNICODE):
                  n=norm_word(tok)
                  if n: exp_tokens.append(n)
              verse_spans[k]=(start,len(exp_tokens))
          print("EXPECTED_TOKENS",len(exp_tokens))

          import numpy as np
          pcm=pathlib.Path("/tmp/cuz01.f32")
          subprocess.run([
              "ffmpeg","-nostdin","-loglevel","error","-y",
              "-i",str(mp3),"-ac","1","-ar","16000","-f","f32le",str(pcm)
          ],check=True)
          audio_samples=np.fromfile(pcm,dtype=np.float32)
          print("PCM_SECONDS",round(len(audio_samples)/16000,3))

          model=WhisperModel("small",device="cpu",compute_type="int8",cpu_threads=4)
          segs,info=model.transcribe(
              audio_samples,language="tr",beam_size=5,word_timestamps=True,
              vad_filter=True,condition_on_previous_text=True
          )
          asr=[]
          seg_count=0
          for seg in segs:
              seg_count+=1
              for w in (seg.words or []):
                  n=norm_word(w.word)
                  if n:
                      asr.append({"n":n,"raw":w.word,"s":float(w.start),"e":float(w.end),"p":float(w.probability or 0)})
          asr_tokens=[x["n"] for x in asr]
          print("ASR_SEGMENTS",seg_count,"ASR_WORDS",len(asr_tokens))

          # Global Levenshtein alignment is strictly monotonic and works directly
          # on arbitrary token sequences; repeated phrases cannot jump to later verses.
          opcodes=Levenshtein.opcodes(exp_tokens,asr_tokens)
          mapping={}
          for op in opcodes:
              tag=op.tag
              if tag=="equal":
                  for j in range(op.src_end-op.src_start):
                      mapping[op.src_start+j]=op.dest_start+j

          edit_distance=Levenshtein.distance(exp_tokens,asr_tokens)

          matched=len(mapping)
          coverage=matched/max(1,len(exp_tokens))
          edit_similarity=1-(edit_distance/max(len(exp_tokens),len(asr_tokens),1))
          print("GLOBAL_EDIT_DISTANCE",edit_distance)
          print("GLOBAL_EDIT_SIMILARITY",round(edit_similarity,6))
          print("EXPECTED_EXACT_TOKEN_COVERAGE",round(coverage,6),"MATCHED",matched)

          pred={}
          unresolved=[]
          for k in keys:
              a,b=verse_spans[k]
              mapped=[mapping[i] for i in range(a,b) if i in mapping]
              if not mapped:
                  unresolved.append(k)
                  continue
              mapped=sorted(mapped)
              first,last=mapped[0],mapped[-1]
              pred[k]={
                  "start":max(0,asr[first]["s"]-0.12),
                  "end":asr[last]["e"]+0.18,
                  "matched_tokens":len(mapped),
                  "expected_tokens":b-a,
                  "coverage":len(mapped)/max(1,b-a),
                  "first_asr_index":first,
                  "last_asr_index":last
              }

          # No guessed audio is allowed in production. The interpolation below is QA-only so
          # a failed verse can still be measured; any unresolved verse makes the gate fail.
          for idx,k in enumerate(keys):
              if k in pred: continue
              prev=next((pred[keys[j]] for j in range(idx-1,-1,-1) if keys[j] in pred),None)
              nxt=next((pred[keys[j]] for j in range(idx+1,len(keys)) if keys[j] in pred),None)
              if prev and nxt:
                  s=prev["end"]; e=nxt["start"]
              elif prev:
                  s=prev["end"]; e=s+2
              elif nxt:
                  e=nxt["start"]; s=max(0,e-2)
              else:
                  raise SystemExit("No alignment anchors")
              pred[k]={
                  "start":s,"end":max(s+0.2,e),
                  "matched_tokens":0,
                  "expected_tokens":verse_spans[k][1]-verse_spans[k][0],
                  "coverage":0,
                  "qa_interpolated":True
              }

          start_diff=[]; end_diff=[]; per={}
          signed_start=[]; signed_end=[]
          for k in keys:
              hard_s=float(verses[k]["audio_start"])
              hard_e=float(verses[k]["audio_end"])
              sdiff=pred[k]["start"]-hard_s
              ediff=pred[k]["end"]-hard_e
              ds=abs(sdiff); de=abs(ediff)
              signed_start.append(sdiff); signed_end.append(ediff)
              start_diff.append(ds); end_diff.append(de)
              per[k]={
                  **pred[k],
                  "hard_start":hard_s,"hard_end":hard_e,
                  "start_signed_diff":round(sdiff,3),"end_signed_diff":round(ediff,3),
                  "start_abs_diff":round(ds,3),"end_abs_diff":round(de,3)
              }

          def pct(arr,p):
              x=sorted(arr)
              return x[min(len(x)-1,max(0,math.ceil(p*len(x))-1))]

          metrics={
              "algorithm":"rapidfuzz-levenshtein-global-monotonic-token-alignment-v1",
              "global_edit_distance":edit_distance,
              "global_edit_similarity":edit_similarity,
              "expected_token_match_coverage":coverage,
              "unresolved_initial_count":len(unresolved),
              "median_start_signed_diff":statistics.median(signed_start),
              "median_end_signed_diff":statistics.median(signed_end),
              "median_start_abs_diff":statistics.median(start_diff),
              "median_end_abs_diff":statistics.median(end_diff),
              "p95_start_abs_diff":pct(start_diff,.95),
              "p95_end_abs_diff":pct(end_diff,.95),
              "max_start_abs_diff":max(start_diff),
              "max_end_abs_diff":max(end_diff),
              "verses_start_within_1s":sum(x<=1 for x in start_diff),
              "verses_end_within_1s":sum(x<=1 for x in end_diff),
              "verse_count":141
          }
          print("METRICS",json.dumps(metrics,ensure_ascii=False,indent=2))
          worst=sorted(per.items(),key=lambda kv:max(kv[1]["start_abs_diff"],kv[1]["end_abs_diff"]),reverse=True)[:20]
          print("WORST",json.dumps(worst,ensure_ascii=False,indent=2))

          status="PASS" if (
              coverage>=0.78 and
              len(unresolved)==0 and
              metrics["median_start_abs_diff"]<=1.5 and
              metrics["median_end_abs_diff"]<=1.5 and
              metrics["p95_start_abs_diff"]<=4.0 and
              metrics["p95_end_abs_diff"]<=4.0
          ) else "FAIL"

          out={"status":status,"model":"faster-whisper-small-int8","metrics":metrics,"verses":per}
          pathlib.Path("data/cuz01_asr_alignment_qa.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print("ASR_ALIGNMENT_STATUS",status)
          if status!="PASS":
              raise SystemExit("Monotonic ASR pilot did not meet verified cüz-1 gate")
          PY

      - name: Commit passing ASR pilot QA
        run: |
          set -euo pipefail
          git config user.name "Atlas QA Bot"
          git config user.email "atlas-qa-bot@users.noreply.github.com"
          git add data/cuz01_asr_alignment_qa.json
          git diff --cached --quiet && exit 0
          git commit -m "Validate monotonic ASR alignment against verified cüz 1 boundaries"
          git pull --rebase origin chatgpt/atlas-30cuz-source-locked-v1
          git push
