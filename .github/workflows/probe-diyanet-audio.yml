name: Probe Diyanet ayet audio source

on:
  push:
    branches:
      - chatgpt/cuz01-full-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Diyanet audio implementation
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          base="https://kuran.diyanet.gov.tr"
          scripts=[
            "/mushaf/js/quran/models/AyetDm.js",
            "/mushaf/js/quran/models/Constants.js",
            "/mushaf/js/quran/models/PortalConfig.js",
            "/mushaf/js/quran/models/PageData.js",
            "/mushaf/js/quran/models/QuranDm.js",
            "/mushaf/js/quran/views/reader/core/ayet/AyetViewBase.js",
            "/mushaf/js/quran/views/reader/core/ReaderPanelViewBase.js",
            "/mushaf/js/quran/com/StFunctions.js",
          ]
          def get(u):
            req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
            return urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
          needles=["mp3","audio","sound","voice","ses","play","media","qari","reader","reciter"]
          for path in scripts:
            u=base+path
            try: txt=get(u)
            except Exception as e:
              print("ERR",u,e); continue
            print("\n===== SCRIPT",u,"BYTES",len(txt),"=====")
            low=txt.lower()
            for needle in needles:
              poss=[m.start() for m in re.finditer(re.escape(needle),low)]
              if not poss: continue
              print("--",needle,"count",len(poss))
              for p in poss[:12]:
                print(txt[max(0,p-700):p+1800].replace("\n"," ")[:2600])
          # Search page itself for model/config data likely holding sound base URLs.
          page=get(base+"/mushaf/kuran-meal-1/bakara-suresi-2/ayet-30/diyanet-isleri-baskanligi-meali-1")
          print("\n===== PAGE AUDIO ATTRS =====")
          for pat in [
            r'[^"\'<> ]+\.mp3[^"\'<> ]*',
            r'[^"\'<> ]+\.m4a[^"\'<> ]*',
            r'(?:audio|sound|ses|voice)[^\n<>]{0,600}',
            r'data-[^=]*(?:audio|sound|ses|voice)[^>]{0,600}',
          ]:
            vals=re.findall(pat,page,flags=re.I)
            print("PAT",pat,"COUNT",len(vals))
            for v in vals[:30]:
              print("VAL",v if isinstance(v,str) else repr(v))
          PY
