name: Validate Diyanet Atlas coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Atlas key coverage
        run: |
          python - <<'PY'
          import json
          target=json.load(open("data/atlas_target_keys.json",encoding="utf-8"))
          diyanet=json.load(open("data/diyanet_atlas_5246.json",encoding="utf-8"))
          qa=json.load(open("data/diyanet_atlas_5246_qa.json",encoding="utf-8"))
          keys=target["keys"]
          verses=diyanet["verses"]
          assert len(keys)==5246
          assert list(verses.keys())==keys
          assert len(verses)==5246
          assert all((verses[k].get("diyanet_tr") or "").strip() for k in keys)
          assert qa["status"]=="PASS"
          assert qa["atlas_target_count"]==5246
          assert qa["atlas_target_missing"]==0
          assert qa["atlas_target_empty"]==0
          print("DIYANET_ATLAS_TEXT_ONLY_QA_PASS 5246/5246")
          PY
