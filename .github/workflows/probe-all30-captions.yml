name: Probe all 30 Mazlum Kiper caption sources

on:
  push:
    branches:
      - chatgpt/atlas-30cuz-source-locked-v1
    paths:
      - .github/workflows/probe-all30-captions.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check -q yt-dlp

      - name: Probe subtitle languages for all 30 cüz recordings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, subprocess

          raw=subprocess.check_output(
              ["git","show","211372d12730543d924a8432aad1cac0ab7683fb:data/audio_manifest.js"],
              text=True
          ).strip()
          payload=re.sub(r"^window\.ATLAS_AUDIO\s*=\s*","",raw)
          payload=re.sub(r";\s*$","",payload)
          manifest=json.loads(payload)
          videos=manifest["videos"]

          report={}
          for n in range(1,31):
              vid=videos[str(n)][0]
              url="https://www.youtube.com/watch?v="+vid
              p=subprocess.run(
                  ["yt-dlp","--skip-download","-J",url],
                  text=True,capture_output=True
              )
              if p.returncode:
                  report[str(n)]={"video_id":vid,"ok":False,"error":p.stderr[-800:]}
                  print("CUZ",n,"FAIL",vid,p.stderr[-300:].replace("\n"," "))
                  continue
              meta=json.loads(p.stdout)
              manual=sorted((meta.get("subtitles") or {}).keys())
              auto=sorted((meta.get("automatic_captions") or {}).keys())
              turkish=[x for x in manual+auto if x.lower().startswith("tr")]
              report[str(n)]={
                  "video_id":vid,
                  "ok":True,
                  "manual":manual,
                  "auto_tr":[x for x in auto if x.lower().startswith("tr")],
                  "manual_tr":[x for x in manual if x.lower().startswith("tr")],
                  "turkish":sorted(set(turkish)),
                  "duration":meta.get("duration")
              }
              print("CUZ",n,"VIDEO",vid,"TR",report[str(n)]["turkish"],"DUR",meta.get("duration"))

          open("caption_probe_report.json","w",encoding="utf-8").write(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n"
          )
          ok=sum(1 for v in report.values() if v.get("turkish"))
          print("TURKISH_CAPTION_CUZ_COUNT",ok)
          if ok < 30:
              raise SystemExit("Not all 30 recordings expose Turkish captions: %d/30" % ok)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caption-probe-report
          path: caption_probe_report.json
