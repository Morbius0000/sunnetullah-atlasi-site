name: Probe Fikriyat playlist pagination

on:
  push:
    branches: [chatgpt/atlas-30cuz-source-locked-v1]
    paths: [.github/workflows/probe-fikriyat-pagination.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect raw playlist HTML for pagination/API hints
        run: |
          python - <<'PY'
          import re, urllib.request
          url="https://www.fikriyat.com/dinle/kuran-i-kerim-dinle/meal-cuz-dinle/mazlum-kiper-cuz/calma-listesi"
          raw=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=30).read().decode("utf-8","replace")
          print("HTML_BYTES",len(raw))
          print("MP3_COUNT",len(set(re.findall(r'https://[^"\\]+\\.mp3',raw))))
          needles=["playlistid","loadmore","load-more","pageindex","pagesize","pageSize","pagination","ajax","GetPlaylist","playlistId","songlist","moreSong","nextPage","data-page"]
          low=raw.lower()
          for needle in needles:
              pos=0; found=0
              while True:
                  i=low.find(needle.lower(),pos)
                  if i<0: break
                  found+=1
                  print("\nNEEDLE",needle,"#",found)
                  print(raw[max(0,i-700):min(len(raw),i+1400)].replace("\n"," ")[:2100])
                  pos=i+len(needle)
                  if found>=5: break
          # Print likely endpoint strings.
          for x in sorted(set(re.findall(r'["\']([^"\']*(?:playlist|song|audio)[^"\']*)["\']',raw,re.I))):
              if len(x)<500:
                  print("STRING",x)
          bundles=re.findall(r'<script[^>]+src="([^"]*bundles/table/js[^"]*)"',raw,re.I)
          for src in bundles:
              if src.startswith("/"):
                  src="https://www.fikriyat.com"+src.replace("&amp;","&")
              print("BUNDLE",src)
              js=urllib.request.urlopen(urllib.request.Request(src,headers={"User-Agent":"Mozilla/5.0"}),timeout=30).read().decode("utf-8","replace")
              print("BUNDLE_BYTES",len(js))
              for needle in ["AddMoreSong","playlistid","pageIndex","pageSize","GetSong","LoadMore","get-more","more-song","songlist"]:
                  pos=0; count=0
                  while True:
                      i=js.lower().find(needle.lower(),pos)
                      if i<0: break
                      count+=1
                      print("\nJS_NEEDLE",needle,"#",count)
                      print(js[max(0,i-1400):min(len(js),i+3200)].replace("\n"," ")[:4600])
                      pos=i+len(needle)
                      if count>=8: break
          PY
