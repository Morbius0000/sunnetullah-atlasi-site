name: Probe YouTube timedtext without video page

on:
  push:
    branches: [chatgpt/atlas-30cuz-source-locked-v1]
    paths: [.github/workflows/probe-youtube-timedtext.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe cüz 1 caption endpoint directly
        run: |
          python - <<'PY'
          import urllib.request
          vid="2me0jJCXs4I"
          ua={"User-Agent":"Mozilla/5.0"}
          urls=[
            f"https://www.youtube.com/api/timedtext?type=list&v={vid}",
            f"https://www.youtube.com/api/timedtext?v={vid}&lang=tr&kind=asr&fmt=json3",
            f"https://www.youtube.com/api/timedtext?v={vid}&lang=tr&fmt=json3"
          ]
          for u in urls:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=ua),timeout=30)
                  b=r.read()
                  print("URL",u,"HTTP",r.status,"TYPE",r.headers.get("Content-Type"),"BYTES",len(b))
                  print(b[:3000].decode("utf-8","replace"))
              except Exception as e:
                  print("FAIL",u,repr(e))
          PY
