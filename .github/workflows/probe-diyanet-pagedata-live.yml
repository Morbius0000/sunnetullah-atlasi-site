name: Probe live Diyanet page-data endpoint

on:
  push:
    branches: [chatgpt/atlas-30cuz-source-locked-v1]
    paths: [.github/workflows/probe-diyanet-pagedata-live.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact official structured page endpoint
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          ua={"User-Agent":"Mozilla/5.0","Referer":"https://kuran.diyanet.gov.tr/mushaf_v2"}
          bases=[
            "https://kuran.diyanet.gov.tr/mushaf_v2/qurandm/pagedata",
            "https://kuran.diyanet.gov.tr/qurandm/pagedata"
          ]
          for base in bases:
            for pid in [0,1,2]:
              url=base+f"?id={pid}&itf=0&iml=1&iqr=1&ml=1&ql=7&iar=0"
              try:
                r=urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=30)
                b=r.read()
                print("\nURL",url,"HTTP",r.status,"TYPE",r.headers.get("Content-Type"),"BYTES",len(b))
                txt=b.decode("utf-8","replace")
                print("HEAD",txt[:1800].replace("\n"," "))
                try:
                  j=json.loads(txt)
                  print("KEYS",sorted(j.keys()) if isinstance(j,dict) else type(j).__name__)
                  if isinstance(j,dict):
                    ma=j.get("MealAyats") or []
                    qa=j.get("QuranAyats") or []
                    print("PAGE",j.get("PageNo"),"MEAL_COUNT",len(ma),"QURAN_COUNT",len(qa))
                    print("MEAL_SAMPLE",json.dumps(ma[:2],ensure_ascii=False)[:2500])
                except Exception as e:
                  print("JSON_FAIL",repr(e))
              except Exception as e:
                print("\nFAIL",url,repr(e))
          PY
