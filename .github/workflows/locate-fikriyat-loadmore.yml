name: Locate Fikriyat load-more handler

on:
  push:
    branches: [chatgpt/atlas-30cuz-source-locked-v1]
    paths: [.github/workflows/locate-fikriyat-loadmore.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan all Fikriyat page scripts for AddMoreSong and playlist pagination
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse
          page="https://www.fikriyat.com/dinle/kuran-i-kerim-dinle/meal-cuz-dinle/mazlum-kiper-cuz/calma-listesi"
          ua={"User-Agent":"Mozilla/5.0"}
          raw=urllib.request.urlopen(urllib.request.Request(page,headers=ua),timeout=30).read().decode("utf-8","replace")
          srcs=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',raw,re.I):
              src=src.replace("&amp;","&")
              src=urllib.parse.urljoin(page,src)
              if src not in srcs: srcs.append(src)
          print("SCRIPT_COUNT",len(srcs))
          needles=["AddMoreSong","list-more-btn","tmdPlaylistItem","songListObj","playlistid","loadmore","pageindex","pagesize","lazy"]
          for idx,src in enumerate(srcs,1):
              try:
                  js=urllib.request.urlopen(urllib.request.Request(src,headers=ua),timeout=30).read().decode("utf-8","replace")
              except Exception as e:
                  print("SCRIPT_FAIL",idx,src,repr(e)); continue
              low=js.lower()
              matches=[n for n in needles if n.lower() in low]
              # Also inspect endpoint-looking strings in likely scripts.
              eps=sorted(set(re.findall(r'["\']([^"\']{0,180}(?:song|playlist|lazy|more)[^"\']{0,180})["\']',js,re.I)))
              if matches or eps:
                  print("\nSCRIPT",idx,src,"BYTES",len(js),"MATCHES",matches)
              for n in matches:
                  pos=0; count=0
                  while True:
                      p=low.find(n.lower(),pos)
                      if p<0: break
                      count+=1
                      print("CTX",n,count,js[max(0,p-1800):min(len(js),p+5000)].replace("\n"," ")[:6800])
                      pos=p+len(n)
                      if count>=6: break
              for e in eps[:120]:
                  if len(e)<350: print("EP",e)
          PY
