name: Consolidate verified Atlas audio QA

on:
  push:
    branches:
      - codex/atlas-all-verses-v1
    paths:
      - .github/workflows/consolidate-verified-audio-qa.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original passing reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/original artifacts/repair
          gh run download 37182117960 --pattern 'atlas-locked-cuz-*' --dir artifacts/original

      - name: Replace Cuz 13 and 18 with clean repair reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find artifacts/original -type f \( -name 'cuz13.json' -o -name 'cuz18.json' \) -delete
          gh run download 37184987977 --pattern 'atlas-repair-cuz-*' --dir artifacts/repair
          python - <<'PY'
          import json, pathlib
          reports=list(pathlib.Path("artifacts").glob("**/cuz*.json"))
          rows=[]
          for p in reports:
              d=json.loads(p.read_text(encoding="utf-8"))
              rows.append((int(d["cuz"]),d["status"],p))
          rows.sort()
          assert len(rows)==29, len(rows)
          assert [x[0] for x in rows]==list(range(2,31)), [x[0] for x in rows]
          assert all(x[1]=="PASS" for x in rows), [(c,s,str(p)) for c,s,p in rows if s!="PASS"]
          print("REPORT_SET_PASS", [(c,s) for c,s,_ in rows])
          PY

      - name: Build final all-30 enrichment and QA
        run: |
          set -euo pipefail
          python scripts/build_locked_target_alignment_manifest.py
          python scripts/aggregate_all30_enrichment.py
          python - <<'PY'
          import json, pathlib
          target=json.load(open("data/atlas_target_keys.json",encoding="utf-8"))
          qa=json.load(open("data/all30_audio_qa.json",encoding="utf-8"))
          reports=list(pathlib.Path("artifacts").glob("**/cuz*.json"))
          assert len(reports)==29
          assert qa["status"]=="PASS"
          assert qa["target_count"]==5246
          assert qa["cuz1_preserved_target_count"]==131
          assert qa["generated_cuz2_30_target_count"]==5115
          assert qa["missing_target_count"]==0
          assert qa["low_confidence_target_count"]==0
          assert qa["source_lock_fail_count"]==0
          assert len(target["keys"])==5246
          print("ALL30_FINAL_GATE_PASS target=5246 additions=0 removals=0")
          PY

      - name: Prove canonical Atlas research data unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            data/atlas_public.js data/atlas_public.boot.js data/atlas_public.part01.js \
            data/atlas_public.part02.js data/atlas_public.part03.js \
            data/atlas_public.part04.js data/atlas_public.part05.js \
            data/atlas_public.part06.js

      - name: Commit generated enrichment to work branch only
        run: |
          set -euo pipefail
          git config user.name "Atlas QA Bot"
          git config user.email "atlas-qa-bot@users.noreply.github.com"
          git add data/verse_enrichment_all30.js data/all30_audio_qa.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate verified audio layer for all locked Atlas targets"
          git pull --rebase origin codex/atlas-all-verses-v1
          git push origin HEAD:codex/atlas-all-verses-v1
